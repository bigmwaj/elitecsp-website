name: Build and Deploy to AWS S3

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cloudfront_invalidation:
        description: Invalidate CloudFront cache after S3 deploy
        required: false
        type: boolean
        default: true

jobs:
  test-api:
    name: Test API (Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test all modules
        working-directory: api-app-project
        run: mvn clean package

      - name: Upload api-app-contact Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: elite-csp-contact
          path: api-app-project/api-app-contact/target/elite-csp-contact.jar

      - name: Upload api-app-cms Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: elite-csp-cms
          path: api-app-project/api-app-cms/target/elite-csp-cms.jar

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            api-app-project/api-app-contact/target/site/jacoco/
            api-app-project/api-app-cms/target/site/jacoco/

  build-and-deploy:
    name: Build and Deploy UI
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ui-app/package-lock.json

      - name: Install dependencies
        working-directory: ui-app
        run: npm ci

      - name: Build Angular app
        working-directory: ui-app
        run: npm run build -- --configuration=production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "S3_BUCKET is empty. Set repo variable S3_BUCKET_NAME to your bucket name (no s3:// prefix)."
            exit 1
          fi

          DEST="s3://${S3_BUCKET}"

          # Hashed static assets — safe to cache for 1 year
          aws s3 sync "ui-app/dist/ui-app/browser" "${DEST}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # index.html must never be cached
          aws s3 cp "ui-app/dist/ui-app/browser/index.html" "${DEST}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.cloudfront_invalidation) && vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "CloudFront invalidation condition met. Running invalidation for distribution ${CLOUDFRONT_DISTRIBUTION_ID} on paths /*"
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
