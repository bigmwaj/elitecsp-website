name: Elite CSP CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      invalidate_cloudfront:
        description: Invalidate CloudFront cache for /index.html after S3 deploy
        required: false
        type: boolean
        default: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  BACKEND_WORKDIR: api-app-project
  FRONTEND_WORKDIR: ui-app
  # Angular production output directory uploaded as CI artifact.
  FRONTEND_DIST_DIR: ui-app/dist/ui-app/browser
  # Canonical static folder name after the ui-app assets rename.
  FRONTEND_STATIC_DIR: static
  # Legacy folder name blocked by CI checks.
  LEGACY_FRONTEND_STATIC_DIR: assets
  FRONTEND_ARTIFACT_DOWNLOAD_DIR: /tmp/ui-app-dist
  CONTACT_JAR_PATH: api-app-project/api-app-contact/target/elite-csp-contact.jar
  CONTACT_ARTIFACT_NAME: lambda-api-app-contact
  CONTACT_FUNCTION_NAME: elite-csp-contact

jobs:
  backend-build:
    name: Backend Build (Java 21)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Java runtime
        run: java -version

      - name: Run Maven tests for all modules
        working-directory: ${{ env.BACKEND_WORKDIR }}
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package backend modules
        working-directory: ${{ env.BACKEND_WORKDIR }}
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Validate Lambda JAR artifact
        run: |
          set -euo pipefail

          CONTACT_JAR="${{ env.CONTACT_JAR_PATH }}"

          if [ ! -s "${CONTACT_JAR}" ]; then
            echo "Missing or empty contact Lambda artifact: ${CONTACT_JAR}"
            exit 1
          fi

          echo "Validated Lambda artifact:"
          ls -lh "${CONTACT_JAR}"

      - name: Upload api-app-contact Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONTACT_ARTIFACT_NAME }}
          path: ${{ env.CONTACT_JAR_PATH }}
          if-no-files-found: error

  frontend-build:
    name: Frontend Build (Node.js 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui-app/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: npm ci

      - name: Validate no legacy assets path references remain in ui-app
        run: |
          set -euo pipefail

          LEGACY_DIR="${{ env.LEGACY_FRONTEND_STATIC_DIR }}"
          SEARCH_ROOT="${{ env.FRONTEND_WORKDIR }}"
          MATCH_FILE="$(mktemp)"
          LEGACY_PATH_PATTERN="((src|public)/${LEGACY_DIR}(/|$)|[\"'(/]${LEGACY_DIR}/)"

          grep -RInE --include='*.ts' --include='*.html' --include='*.scss' --include='*.css' --include='*.json' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=dist \
            "${LEGACY_PATH_PATTERN}" "${SEARCH_ROOT}" > "${MATCH_FILE}" || true

          if [ -s "${MATCH_FILE}" ]; then
            echo "Legacy static folder references detected. Update them to '${{ env.FRONTEND_STATIC_DIR }}':"
            cat "${MATCH_FILE}"
            exit 1
          fi

          echo "No legacy '${LEGACY_DIR}' references found in ${SEARCH_ROOT}."

      - name: Build Angular app (production)
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: npm run build -- --configuration=production

      - name: Validate Angular build output
        run: |
          set -euo pipefail

          DIST_DIR="${{ env.FRONTEND_DIST_DIR }}"
          STATIC_DIR="${DIST_DIR}/${{ env.FRONTEND_STATIC_DIR }}"
          INDEX_FILE="${DIST_DIR}/index.html"
          LOGO_FILE="${STATIC_DIR}/images/logo.svg"
          I18N_FILE="${STATIC_DIR}/i18n/en.json"

          if [ ! -d "${DIST_DIR}" ]; then
            echo "Angular build output directory not found: ${DIST_DIR}"
            exit 1
          fi

          if [ ! -f "${INDEX_FILE}" ]; then
            echo "Angular index.html not found: ${INDEX_FILE}"
            exit 1
          fi

          if [ ! -d "${STATIC_DIR}" ]; then
            echo "Angular static directory not found: ${STATIC_DIR}"
            exit 1
          fi

          if [ ! -f "${LOGO_FILE}" ]; then
            echo "Expected logo file not found: ${LOGO_FILE}"
            exit 1
          fi

          if [ ! -f "${I18N_FILE}" ]; then
            echo "Expected i18n file not found: ${I18N_FILE}"
            exit 1
          fi

          echo "Validated Angular build output:"
          ls -lah "${DIST_DIR}" | head -n 40
          echo "Validated static files:"
          ls -lah "${STATIC_DIR}" | head -n 40

      - name: Upload Angular build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-app-dist
          path: ${{ env.FRONTEND_DIST_DIR }}
          if-no-files-found: error

  deploy-backend-lambdas:
    name: Deploy Backend Lambdas
    needs: backend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download api-app-contact Lambda artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ env.CONTACT_ARTIFACT_NAME }}
          path: /tmp/lambda/contact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate deployment prerequisites
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_REGION:-}" ]; then
            echo "AWS_REGION is empty. Set repository variable AWS_REGION."
            exit 1
          fi

          CONTACT_JAR="/tmp/lambda/contact/elite-csp-contact.jar"

          if [ ! -s "${CONTACT_JAR}" ]; then
            echo "Missing or empty contact Lambda artifact: ${CONTACT_JAR}"
            exit 1
          fi

          echo "Deployment inputs validated."
          ls -lh "${CONTACT_JAR}"

      - name: Deploy contact Lambda (elite-csp-contact)
        run: |
          set -euo pipefail
          JAR_FILE="/tmp/lambda/contact/elite-csp-contact.jar"
          FUNCTION_NAME="${{ env.CONTACT_FUNCTION_NAME }}"

          echo "::group::Validating Lambda function ${FUNCTION_NAME}"
          aws lambda get-function --function-name "${FUNCTION_NAME}" >/dev/null
          echo "::endgroup::"

          echo "::group::Updating Lambda code for ${FUNCTION_NAME}"
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --zip-file "fileb://${JAR_FILE}"
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}"
          echo "::endgroup::"

  deploy-frontend:
    name: Deploy Frontend to S3
    needs:
      - frontend-build
      - deploy-backend-lambdas
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download Angular build artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: ui-app-dist
          path: ${{ env.FRONTEND_ARTIFACT_DOWNLOAD_DIR }}

      - name: Validate frontend deployment inputs
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          DIST_DIR="${{ env.FRONTEND_ARTIFACT_DOWNLOAD_DIR }}"
          STATIC_DIR="${DIST_DIR}/${{ env.FRONTEND_STATIC_DIR }}"

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "S3_BUCKET is empty. Set repo variable S3_BUCKET_NAME to your bucket name (no s3:// prefix)."
            exit 1
          fi

          if [ ! -d "${DIST_DIR}" ]; then
            echo "Angular artifact directory is missing: ${DIST_DIR}"
            exit 1
          fi

          if [ ! -f "${DIST_DIR}/index.html" ]; then
            echo "Angular artifact index.html is missing: ${DIST_DIR}/index.html"
            exit 1
          fi

          if [ ! -d "${STATIC_DIR}" ]; then
            echo "Angular static directory is missing: ${STATIC_DIR}"
            exit 1
          fi

          echo "Deployment artifact validation passed for ${DIST_DIR}."

      - name: Deploy frontend static files to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          DIST_DIR="${{ env.FRONTEND_ARTIFACT_DOWNLOAD_DIR }}"
          STATIC_DIR="${{ env.FRONTEND_STATIC_DIR }}"
          DEST="s3://${S3_BUCKET}"
          DATE_TAG="$(date -u +%Y%m%d)"
          VERSIONED_STATIC_DIR="${STATIC_DIR}-${DATE_TAG}"

          if [ -d "${DIST_DIR}/${STATIC_DIR}" ]; then
            mv "${DIST_DIR}/${STATIC_DIR}" "${DIST_DIR}/${VERSIONED_STATIC_DIR}"
          else
            echo "Missing static directory in build output: ${DIST_DIR}/${STATIC_DIR}"
            exit 1
          fi

          # Rewrite references to the date-versioned static directory.
          # Exclude binary assets and sourcemaps for safer in-place edits.
          find "${DIST_DIR}" -type f \
            \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.webmanifest" -o -name "*.json" \) \
            ! -name "*.map" -print0 | xargs -0 sed -i "s#${STATIC_DIR}/#${VERSIONED_STATIC_DIR}/#g"

          echo "Deploying versioned static directory: ${VERSIONED_STATIC_DIR}"

          # Static files are immutable; index.html is uploaded separately with no-cache headers.
          aws s3 sync "${DIST_DIR}" "${DEST}/" \
            --delete \
            --exclude "jobs/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html should never be cached
          aws s3 cp "${DIST_DIR}/index.html" "${DEST}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.invalidate_cloudfront) }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          echo "Invalidating CloudFront distribution ${CLOUDFRONT_DISTRIBUTION_ID} path /index.html"
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/index.html"
