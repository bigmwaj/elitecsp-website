<app-hero
  [title]="'PAGE.PARTNERS.HERO.TITLE'"
  [subtitle]="'PAGE.PARTNERS.HERO.SUBTITLE'"
  [ctaText]="'PAGE.PARTNERS.HERO.CTA'"
  ctaLink="/contact">
</app-hero>

<section class="section partners-section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">{{ 'PAGE.PARTNERS.TAG' | translate }}</span>
      <h2>{{ 'PAGE.PARTNERS.TITLE' | translate }}</h2>
      <p>{{ 'PAGE.PARTNERS.SUBTITLE' | translate }}</p>
    </div>

    <div class="partners-grid">
      @for (partner of partners(); track partner.id) {
        <app-partner-card [partner]="partner" />
      }
    </div>
  </div>
</section>
